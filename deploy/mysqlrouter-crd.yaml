apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mysqlrouters.mysql.oracle.com
spec:
  group: mysql.oracle.com
  scope: Namespaced
  names:
    plural: mysqlrouters
    singular: mysqlrouter
    kind: MySQLRouter
    shortNames:
      - mysqlrt
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["innodbCluster"]
              properties:
                router:
                  type: object
                  properties:
                    name:
                      type: string
                    serviceName:
                      type: string
                    bootstrapSecret:
                      type: string
                    image:
                      type: string
                    replicas:
                      type: integer
                      minimum: 1
                innodbCluster:
                  type: object
                  required: ["nodes"]
                  properties:
                    name:
                      type: string
                    nodeServicePrefix:
                      type: string
                    nodes:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: ["ip"]
                        properties:
                          ip:
                            type: string
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          name:
                            type: string
                          serviceName:
                            type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
