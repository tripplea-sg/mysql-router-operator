apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-router-operator
  namespace: mysql-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mysql-router-operator
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services/finalizers", "endpoints/finalizers", "configmaps/finalizers"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/finalizers"]
    verbs: ["patch", "update"]
  - apiGroups: ["mysql.oracle.com"]
    resources: ["mysqlrouters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["mysql.oracle.com"]
    resources: ["mysqlrouters/status", "mysqlrouters/finalizers"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-router-operator
subjects:
  - kind: ServiceAccount
    name: mysql-router-operator
    namespace: mysql-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mysql-router-operator
